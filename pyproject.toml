[project]
name = "pdm"
version = "0.1.0"
description = "Predictive maintenance pipeline for an electric-motor rotating machine (SENAI SC case study)."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
