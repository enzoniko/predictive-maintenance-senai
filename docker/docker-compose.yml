services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: pdm
      POSTGRES_DB: pdm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      # Overrides configs/default.yaml's sqlite default; see serving/db.py.
      PDM_DATABASE_URL: postgresql+psycopg2://pdm:pdm@postgres:5432/pdm
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    environment:
      PDM_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
